<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075985">
  <meta name="description" content="蘇澳國小傑出學校攤位好禮轉盤，每次抽中一項鯖魚好禮。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23073b5c'/%3E%3Cpath d='M13 32c10-13 23-13 34 0-11 13-24 13-34 0Zm34 0 8-8v16l-8-8Z' fill='%23f7c948'/%3E%3Ccircle cx='26' cy='29' r='2' fill='%23073b5c'/%3E%3C/svg%3E">
  <title>蘇澳國小｜傑出學校好禮轉盤</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero" aria-labelledby="page-title">
      <div class="school-badge" aria-hidden="true">SU-AO</div>
      <div>
        <p class="eyebrow">蘇澳國小・傑出學校參訪攤位</p>
        <h1 id="page-title">轉出你的鯖喜好禮！</h1>
        <p class="subtitle">按下「開始轉動」，每位參觀民眾都能獲得一項獎品</p>
      </div>
      <button class="icon-button" id="fullscreenButton" type="button" aria-label="切換全螢幕">
        <span aria-hidden="true">⛶</span><span class="desktop-label"> 全螢幕</span>
      </button>
    </header>

    <main class="game-layout">
      <section class="wheel-panel" aria-labelledby="wheel-heading">
        <h2 id="wheel-heading" class="sr-only">好禮轉盤</h2>
        <div class="wheel-stage">
          <div class="pointer" aria-hidden="true"><span></span></div>
          <canvas id="wheel" width="900" height="900" role="img" aria-label="四項等機率獎品轉盤：珍鯖鬆、鯖鬆醬心蛋捲、鯖鬆吃雪花酥、螢幕擦拭布"></canvas>
          <div class="wheel-center" aria-hidden="true"><span>鯖</span><small>好禮</small></div>
        </div>
        <button class="spin-button" id="spinButton" type="button">
          <span class="button-kicker">按一下抽好禮</span>
          <strong>開始轉動</strong>
        </button>
        <p class="fair-note"><span aria-hidden="true">✓</span> 四項好禮等機率・每次必中一項</p>
      </section>

      <aside class="prize-panel" aria-labelledby="prize-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">TODAY'S GIFTS</p>
            <h2 id="prize-title">今天有哪些好禮？</h2>
          </div>
          <span class="count-badge">4 款</span>
        </div>
        <div class="prize-list" id="prizeList"></div>
        <p class="booth-note">請將中獎畫面出示給攤位工作人員兌換</p>
      </aside>
    </main>
  </div>

  <div class="result-modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
    <div class="result-card">
      <p class="result-kicker">恭喜獲得</p>
      <div class="result-image-wrap"><img id="resultImage" src="" alt=""></div>
      <h2 id="resultTitle"></h2>
      <p>請出示這個畫面兌換獎品</p>
      <button type="button" id="againButton">下一位，再轉一次</button>
    </div>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="sr-only" id="liveRegion" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
